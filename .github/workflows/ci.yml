name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  FLOTILLA_BUILD_ID: ${{ github.sha }}

jobs:
  daemon:
    name: daemon — test + static builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: daemon
      - name: Format
        # Without --all: checks every workspace member but not the vendored
        # Alacritty/VTE path dependencies, which keep upstream's nightly style.
        run: cargo fmt --check
      - name: Clippy (non-UI crates)
        run: cargo clippy --locked --workspace --exclude flc-ui --exclude flc-terminal --exclude flc-shell --exclude flotilla --all-targets -- -D warnings
      - name: Test (non-UI crates)
        run: cargo test --locked --workspace --exclude flc-ui --exclude flc-terminal --exclude flc-shell --exclude flotilla
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: cargo-zigbuild
      - name: Build static daemons (musl)
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --locked --release -p flotillad --target "$t"
          done
          mkdir -p dist/daemon
          cp target/x86_64-unknown-linux-musl/release/flotillad dist/daemon/flotillad-x86_64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/flotillad dist/daemon/flotillad-aarch64-unknown-linux-musl
          file dist/daemon/*
          ls -l dist/daemon
          ./dist/daemon/flotillad-x86_64-unknown-linux-musl version --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon
          path: dist/daemon/
          if-no-files-found: error

  ui-check:
    name: client — Linux type-check (headless gpui)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ui-check
      - name: Clippy (UI crates)
        run: cargo clippy --locked -p flc-ui -p flc-terminal -p flc-shell -p flotilla --all-targets -- -D warnings
      - name: Test (UI crates)
        run: cargo test --locked -p flc-ui -p flc-terminal -p flc-shell -p flotilla

  windows:
    name: client — Windows build, self-test, installer
    needs: daemon
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # CI runs and smoke tests never talk to the release feed.
      FLOTILLA_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows
          cache-on-failure: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daemon
          path: dist/daemon
      - name: Portable tests on Windows
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc -p fl-proto -p fl-transport --lib
          cargo test --locked --target x86_64-pc-windows-msvc -p flotilla --bins
          cargo test --locked --target x86_64-pc-windows-msvc -p flc-terminal --lib
          cargo test --locked --target x86_64-pc-windows-msvc -p flc-shell --lib
          cargo test --locked --target x86_64-pc-windows-msvc -p flc-sync --lib
      - name: Build flotilla.exe (daemons embedded)
        shell: pwsh
        env:
          FLOTILLA_EMBED_DAEMON_DIR: ${{ github.workspace }}\dist\daemon
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p flotilla
      - name: Verify standalone runtime imports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "MSVC import inspector was not found" }
          $imports = & $dumpbin.FullName /DEPENDENTS target\x86_64-pc-windows-msvc\release\flotilla.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with $LASTEXITCODE" }
          $imports | Tee-Object -FilePath dist\runtime-imports.txt
          if (($imports -join "`n") -match '(?i)\b(?:vcruntime|msvcp|concrt)[\w.]*\.dll\b') {
            throw "portable executable still requires a separately installed VC++ runtime"
          }
      - name: Self-test release binary
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\x86_64-pc-windows-msvc\release\flotilla.exe -ArgumentList '--self-test=selftest.json' -Wait -PassThru
          if (-not (Test-Path selftest.json)) { throw "self-test did not write its report" }
          Get-Content selftest.json
          if (-not ((Get-Content selftest.json -Raw | ConvertFrom-Json).ok)) { throw "self-test report failed" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $meta = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          $ver = ($meta.packages | Where-Object { $_.name -eq 'flotilla' }).version
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=$ver" "/DSourceExe=$PWD\target\x86_64-pc-windows-msvc\release\flotilla.exe" "/O$PWD\dist" packaging\windows\flotilla.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Copy-Item target\x86_64-pc-windows-msvc\release\flotilla.exe dist\flotilla.exe
          New-Item -ItemType Directory -Force dist\licenses | Out-Null
          Copy-Item crates\client\flc-ui\NOTICE dist\licenses\NOTICE.txt
          Copy-Item crates\client\flc-ui\assets\fonts\*.txt dist\licenses\
          Copy-Item packaging\windows\Apache-2.0.txt dist\licenses\
          Compress-Archive -Path dist\licenses -DestinationPath dist\flotilla-windows-licenses.zip
          Get-ChildItem dist
      - name: Smoke per-user install, native window and uninstall
        shell: pwsh
        run: |
          $installer = Start-Process dist\Flotilla-Setup-x64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "installer failed with $($installer.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Flotilla'
          try {
            if (-not (Test-Path "$installed\flotilla.exe")) { throw "per-user executable is missing" }
            foreach ($notice in @('NOTICE.txt', 'Apache-2.0.txt', 'Inter-LICENSE.txt', 'JetBrainsMono-OFL.txt')) {
              if (-not (Test-Path "$installed\licenses\$notice")) { throw "installed license is missing: $notice" }
            }
            pwsh -NoProfile -STA -File scripts/smoke_windows_ui.ps1 -Exe "$installed\flotilla.exe"
            if ($LASTEXITCODE -ne 0) { throw "installed application UI smoke failed" }
          } finally {
            $uninstaller = Start-Process "$installed\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($uninstaller.ExitCode -ne 0) { throw "uninstall failed with $($uninstaller.ExitCode)" }
          }
      - name: Collect application logs
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'Flotilla\logs'
          if (Test-Path $logs) {
            New-Item -ItemType Directory -Force dist\ui-smoke\logs | Out-Null
            Copy-Item "$logs\*" dist\ui-smoke\logs\
          }
      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke
          path: |
            dist/ui-smoke/
            selftest.json
            dist/runtime-imports.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flotilla-windows-x64
          path: |
            dist/Flotilla-Setup-x64.exe
            dist/flotilla.exe
            dist/flotilla-windows-licenses.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: [daemon, ui-check, windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The signing key and tool are release-only: no other job can sign.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build the signing tool
        run: cargo build --release --manifest-path scripts/fl-sign/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p upload
          cp artifacts/flotilla-windows-x64/Flotilla-Setup-x64.exe upload/
          cp artifacts/flotilla-windows-x64/flotilla.exe upload/flotilla-x64.exe
          cp artifacts/flotilla-windows-x64/flotilla-windows-licenses.zip upload/
          cp artifacts/daemon/flotillad-* upload/
          (cd upload && sha256sum * > SHA256SUMS.txt)
          ls -l upload
      - name: Verify the built assets against SHA256SUMS.txt
        run: (cd upload && sha256sum -c SHA256SUMS.txt)
      - name: Load the release tag and the product version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="nightly"
          fi
          # The updater orders releases by the version the binary reports
          # (`PRODUCT_VERSION`), not by the milestone tag, and its self-check
          # compares the report with the manifest.
          version=$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "flotilla"))')
          echo "FLOTILLA_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "FLOTILLA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "tag=$tag version=$version"
      - name: Sign the assets and write the signed manifest
        env:
          FLOTILLA_SIGNING_KEY: ${{ secrets.FLOTILLA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${FLOTILLA_SIGNING_KEY:-}" ]]; then
            echo "::error::FLOTILLA_SIGNING_KEY is not set; refusing to publish an unsigned release"
            exit 1
          fi
          sign=./scripts/fl-sign/target/release/fl-sign
          # The secret must be the key the client was built to trust.
          pub=$("$sign" pubkey | sed -n 's/^public_key=//p')
          grep -qF "$pub" crates/client/flotilla/src/updater/signature.rs || {
            echo "::error::FLOTILLA_SIGNING_KEY does not match the public key embedded in the client"
            exit 1
          }
          echo "FLOTILLA_SIGNING_PUBLIC_KEY=$pub" >> "$GITHUB_ENV"
          "$sign" manifest --version "$FLOTILLA_RELEASE_VERSION" --tag "$FLOTILLA_RELEASE_TAG" \
            --dir upload --out upload/latest.json
          # latest.json is signed by `manifest`; every artifact gets its own
          # detached signature so a manually downloaded installer can be checked.
          "$sign" sign upload/Flotilla-Setup-x64.exe upload/flotilla-x64.exe \
            upload/flotilla-windows-licenses.zip \
            upload/flotillad-x86_64-unknown-linux-musl \
            upload/flotillad-aarch64-unknown-linux-musl upload/SHA256SUMS.txt
          "$sign" verify "$pub" upload/latest.json upload/Flotilla-Setup-x64.exe \
            upload/flotilla-x64.exe upload/flotilla-windows-licenses.zip \
            upload/flotillad-x86_64-unknown-linux-musl \
            upload/flotillad-aarch64-unknown-linux-musl upload/SHA256SUMS.txt
          ls -l upload
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tag with a pre-release suffix (v0.2.0-rc.1) publishes a pre-release.
            prerelease=()
            [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" upload/* --title "Flotilla $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          else
            gh release delete nightly --yes --cleanup-tag || true
            gh release create nightly upload/* --prerelease --target "$GITHUB_SHA" \
              --title "Flotilla nightly (${GITHUB_SHA::7})" \
              --notes "Automated build of ${GITHUB_SHA}. Install with Flotilla-Setup-x64.exe. Portable users should extract flotilla-windows-licenses.zip next to flotilla-x64.exe."
          fi
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$FLOTILLA_RELEASE_TAG" --dir verify --clobber
          (cd verify && sha256sum -c SHA256SUMS.txt)
          sign=./scripts/fl-sign/target/release/fl-sign
          "$sign" verify "$FLOTILLA_SIGNING_PUBLIC_KEY" verify/latest.json \
            verify/Flotilla-Setup-x64.exe verify/flotilla-x64.exe \
            verify/flotilla-windows-licenses.zip \
            verify/flotillad-x86_64-unknown-linux-musl \
            verify/flotillad-aarch64-unknown-linux-musl verify/SHA256SUMS.txt

  signing:
    name: sign release manifest (dry run)
    needs: [daemon, windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build the signing tool
        run: cargo build --release --manifest-path scripts/fl-sign/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Assemble, sign and verify without publishing
        env:
          FLOTILLA_SIGNING_KEY: ${{ secrets.FLOTILLA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${FLOTILLA_SIGNING_KEY:-}" ]]; then
            echo "::error::FLOTILLA_SIGNING_KEY is not set"
            exit 1
          fi
          mkdir -p upload
          cp artifacts/flotilla-windows-x64/Flotilla-Setup-x64.exe upload/
          cp artifacts/flotilla-windows-x64/flotilla.exe upload/flotilla-x64.exe
          cp artifacts/flotilla-windows-x64/flotilla-windows-licenses.zip upload/
          cp artifacts/daemon/flotillad-* upload/
          (cd upload && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          version=$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "flotilla"))')
          sign=./scripts/fl-sign/target/release/fl-sign
          pub=$("$sign" pubkey | sed -n 's/^public_key=//p')
          grep -qF "$pub" crates/client/flotilla/src/updater/signature.rs || {
            echo "::error::FLOTILLA_SIGNING_KEY does not match the public key embedded in the client"
            exit 1
          }
          "$sign" manifest --version "$version" --tag "dry-run" --dir upload --out upload/latest.json
          "$sign" sign upload/Flotilla-Setup-x64.exe upload/flotilla-x64.exe \
            upload/flotilla-windows-licenses.zip \
            upload/flotillad-x86_64-unknown-linux-musl \
            upload/flotillad-aarch64-unknown-linux-musl upload/SHA256SUMS.txt
          "$sign" verify "$pub" upload/latest.json upload/Flotilla-Setup-x64.exe \
            upload/flotilla-x64.exe upload/flotilla-windows-licenses.zip \
            upload/flotillad-x86_64-unknown-linux-musl \
            upload/flotillad-aarch64-unknown-linux-musl upload/SHA256SUMS.txt
          echo "signed manifest:" && cat upload/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-dry-run
          path: upload/
          if-no-files-found: error
