[workspace]
resolver = "3"
members = [
    "crates/fl-proto",
    "crates/fl-prochost-proto",
    "crates/fl-transport",
    "crates/fl-testkit",
    "crates/fl-model",
    "crates/fl-term",
    "crates/daemon/fld-server",
    "crates/daemon/fld-prochost",
    "crates/daemon/fld-store",
    "crates/daemon/fld-git",
    "crates/daemon/fld-forge",
    "crates/daemon/fld-agent",
    "crates/daemon/flotillad",
    "crates/client/flc-conn",
    "crates/client/flc-sync",
    "crates/client/flc-shell",
    "crates/client/flc-ui",
    "crates/client/flc-terminal",
    "crates/client/flc-editor",
    "crates/client/flotilla",
]
exclude = ["vendor/alacritty_terminal", "vendor/vte"]
# gpui crates (flc-ui, flc-terminal, flc-editor, flotilla) are excluded from default builds: on
# Linux they are type-checked headless in CI; the real build happens on windows-latest.
default-members = [
    "crates/fl-proto",
    "crates/fl-prochost-proto",
    "crates/fl-transport",
    "crates/fl-testkit",
    "crates/fl-model",
    "crates/fl-term",
    "crates/daemon/fld-server",
    "crates/daemon/fld-prochost",
    "crates/daemon/fld-store",
    "crates/daemon/fld-git",
    "crates/daemon/fld-forge",
    "crates/daemon/fld-agent",
    "crates/daemon/flotillad",
    "crates/client/flc-conn",
    "crates/client/flc-sync",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
fl-proto = { path = "crates/fl-proto" }
fl-prochost-proto = { path = "crates/fl-prochost-proto" }
fl-transport = { path = "crates/fl-transport" }
fl-testkit = { path = "crates/fl-testkit" }
fl-model = { path = "crates/fl-model" }
fl-term = { path = "crates/fl-term" }
fld-server = { path = "crates/daemon/fld-server" }
fld-prochost = { path = "crates/daemon/fld-prochost" }
fld-store = { path = "crates/daemon/fld-store" }
fld-git = { path = "crates/daemon/fld-git" }
fld-forge = { path = "crates/daemon/fld-forge" }
fld-agent = { path = "crates/daemon/fld-agent" }
flc-conn = { path = "crates/client/flc-conn" }
flc-sync = { path = "crates/client/flc-sync" }
flc-shell = { path = "crates/client/flc-shell" }
flc-ui = { path = "crates/client/flc-ui" }
flc-terminal = { path = "crates/client/flc-terminal" }
flc-editor = { path = "crates/client/flc-editor" }

alacritty_terminal = { version = "=0.26.0", path = "vendor/alacritty_terminal" }
base64 = "0.22"
anyhow = "1"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
ignore = "0.4"
imara-diff = "0.2"
keyring = "4.2"
libc = "0.2"
notify = "8"
postcard = { version = "1.1", features = ["use-std"] }
portable-pty = "=0.9.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
# Only LF ends a line (CRLF is LF preceded by CR), matching git and the daemon.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
# Grammars for flc-editor (spec §6: 20+). Each depends only on `tree-sitter-language`, so they
# all link against the single `tree-sitter` runtime above. SQL comes from the arborium
# collection because `tree-sitter-sequel` pins `cc ~1.2` and would downgrade the workspace's cc.
arborium-sql = "2.18"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
unicode-segmentation = "1.10"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
vte = { version = "=0.15.0", path = "vendor/vte", features = ["ansi", "serde"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Smaller debug binaries (the bootstrap e2e test uploads target/debug/flotillad)
# and fast crypto/compression in tests.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
