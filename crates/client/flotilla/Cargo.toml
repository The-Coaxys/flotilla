[package]
name = "flotilla"
description = "Flotilla native Windows client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# Local X11 runs on Linux for development and UI checks; releases ship Windows.
linux-x11 = ["gpui/x11"]

[[bin]]
name = "flotilla"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
fl-proto.workspace = true
fl-transport.workspace = true
flc-conn.workspace = true
flc-shell.workspace = true
flc-sync.workspace = true
flc-ui.workspace = true
hex.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
gpui = "0.2.2"
keyring.workspace = true

[target.'cfg(not(windows))'.dependencies]
gpui = { version = "0.2.2", default-features = false }

[dev-dependencies]
tempfile.workspace = true
