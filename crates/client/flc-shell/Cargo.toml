[package]
name = "flc-shell"
description = "Flotilla workspace shell: view split tree, tabs, panes and terminal workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fl-model.workspace = true
fl-term.workspace = true
flc-sync.workspace = true
flc-terminal.workspace = true
flc-ui.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
gpui = "0.2.2"

[target.'cfg(not(windows))'.dependencies]
gpui = { version = "0.2.2", default-features = false }
